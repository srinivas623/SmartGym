<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gym Kiosk</title>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 20px;
        }

        #count {
            font-size: 70px;
            font-weight: bold;
        }

        #status {
            font-size: 22px;
            margin-bottom: 15px;
        }

        #reader {
            width: 320px;
            max-width: 100%;
            margin: 0 auto 15px;
            border-radius: 10px;
            overflow: hidden;
        }

        input {
            font-size: 18px;
            padding: 10px;
            border-radius: 8px;
            border: none;
            width: 180px;
            text-transform: uppercase;
        }

        button {
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #message {
            margin: 15px auto;
            padding: 15px;
            max-width: 360px;
            border-radius: 8px;
            font-size: 20px;
            display: none;
        }

        .ok {
            background: #2e7d32;
        }

        .bad {
            background: #c62828;
        }

        ul {
            list-style: none;
            padding: 0;
            max-width: 360px;
            margin: 0 auto;
            text-align: left;
        }

        li {
            background: #222;
            margin: 6px 0;
            padding: 10px 14px;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <h1>Gym Kiosk</h1>
    <div id="count">0</div>
    <div id="status">Quiet</div>

    <div id="reader"></div>
    <p id="camNote"></p>

    <p>No camera? Type a code:</p>
    <input id="code" placeholder="e.g. M001">
    <button onclick="manualScan()">Scan</button>

    <div id="message"></div>

    <h3>Currently inside</h3>
    <ul id="inside"></ul>

    <script>
        const capacity = 50;

        const members = {
            M001: { name: "Ravi Kumar", active: true },
            M002: { name: "Anjali Rao", active: true },
            M003: { name: "Kiran Reddy", active: false }
        };

        let inside = JSON.parse(localStorage.getItem("inside")) || [];

        function save() {
            localStorage.setItem("inside", JSON.stringify(inside));
        }

        function showMessage(text, type) {
            const box = document.getElementById("message");
            box.textContent = text;
            box.className = type;
            box.style.display = "block";
            setTimeout(() => { box.style.display = "none"; }, 3000);
        }

        // Core logic: one function used by both camera and typing
        function processCode(rawCode) {
            const code = rawCode.trim().toUpperCase();
            const member = members[code];
            if (!member) { showMessage("Unknown code", "bad"); return; }
            if (!member.active) { showMessage(member.name + ": membership expired", "bad"); return; }

            const index = inside.findIndex(p => p.code === code);
            if (index === -1) {
                inside.push({ code: code, name: member.name, time: new Date().toISOString() });
                showMessage("Welcome, " + member.name + " (checked in)", "ok");
            } else {
                inside.splice(index, 1);
                showMessage("Goodbye, " + member.name + " (checked out)", "ok");
            }
            save();
            update();
        }

        function manualScan() {
            const input = document.getElementById("code");
            processCode(input.value);
            input.value = "";
        }

        // Camera scanning
        let lastCode = "";
        let lastTime = 0;

        function onScanSuccess(decodedText) {
            const now = Date.now();
            // Ignore the same code seen again within 5 seconds
            if (decodedText === lastCode && now - lastTime < 5000) return;
            lastCode = decodedText;
            lastTime = now;
            processCode(decodedText);
        }

        const scanner = new Html5Qrcode("reader");
        const config = { fps: 10, qrbox: 220 };

        scanner.start({ facingMode: "environment" }, config, onScanSuccess)
            .catch(() => scanner.start({ facingMode: "user" }, config, onScanSuccess))
            .catch(err => {
                document.getElementById("camNote").textContent =
                    "Camera not available. Use Live Server or https, and allow camera access.";
            });

        function update() {
            const percent = (inside.length / capacity) * 100;
            let label = "Quiet", color = "#4caf50";
            if (percent >= 90) { label = "Full"; color = "#f44336"; }
            else if (percent >= 70) { label = "Busy"; color = "#ff9800"; }
            else if (percent >= 40) { label = "Moderate"; color = "#ffc107"; }

            document.getElementById("count").textContent = inside.length + " / " + capacity;
            const status = document.getElementById("status");
            status.textContent = label;
            status.style.color = color;

            const list = document.getElementById("inside");
            list.innerHTML = "";
            inside.forEach(p => {
                const time = new Date(p.time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
                const li = document.createElement("li");
                li.textContent = p.name + " (in at " + time + ")";
                list.appendChild(li);
            });
        }

        document.getElementById("code").addEventListener("keydown", e => {
            if (e.key === "Enter") manualScan();
        });

        update();
    </script>
</body>

</html>
